// ═══════════════════════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════════════════════
let isHidden=false, twInt=null, cycInt=null, progInt=null, curIdx=0, prog=0;
let activeWorks = CFG.gallery==='all' ? [...WORKS] : WORKS.filter(w=>w.g===CFG.gallery);

// Shuffle
for(let i=activeWorks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[activeWorks[i],activeWorks[j]]=[activeWorks[j],activeWorks[i]];}

function condense(text,max){if(!text||text.length<=max)return text;let t=text.slice(0,max-1);const s=t.lastIndexOf(' ');if(s>max*.5)t=t.slice(0,s);return t+'...'}

function genGrain(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');if(!x)return;const d=x.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=v;d.data[i+1]=v;d.data[i+2]=v;d.data[i+3]=14}x.putImageData(d,0,0);const g=document.createElement('div');g.className='grain-overlay';g.style.backgroundImage=`url(${c.toDataURL('image/png')})`;document.body.appendChild(g)}

function typewrite(text){const el=document.getElementById('titleText');if(!el)return;clearInterval(twInt);el.textContent='';el.classList.remove('condensed','extra-condensed');const d=text.length>55?condense(text,50):text;let i=0;twInt=setInterval(()=>{if(i<d.length){const p=d.slice(0,i+1);el.textContent=p;if(p.length>50){el.classList.add('extra-condensed');el.classList.remove('condensed')}else if(p.length>35){el.classList.add('condensed');el.classList.remove('extra-condensed')}i++}else clearInterval(twInt)},CFG.typewriterSpeed)}

function updateBottom(w){const c=document.getElementById('bottomCard');c.className=`bottom-card gallery-${w.g||'pobots'}`;if(!isHidden)c.classList.add('visible');else c.classList.add('visible','hidden-manual');if(!CFG.showBottom)c.classList.add('hidden-manual');c.querySelector('.card-inner').classList.add('transitioning');setTimeout(()=>{typewrite(CFG.title||w.t||'Untitled');document.getElementById('galleryTag').textContent=ABBR[w.g]||'PBT';document.getElementById('galleryName').textContent=w.g||'Pobots';setTimeout(()=>c.querySelector('.card-inner').classList.remove('transitioning'),80)},350)}

function updateTop(w){const c=document.getElementById('topCard'),img=document.getElementById('thumbImg'),sh=document.getElementById('thumbShimmer'),tt=document.getElementById('thumbTitle'),tg=document.getElementById('thumbGallery');c.className=`top-card gallery-${w.g||'pobots'}`;if(!isHidden)c.classList.add('visible');else c.classList.add('visible','hidden-manual');if(!CFG.showTop)c.classList.add('hidden-manual');c.querySelector('.card-inner').classList.add('top-transitioning');setTimeout(()=>{sh.style.display='block';img.classList.remove('loaded');img.src=w.u||'';img.alt=w.t||'';const title=w.t||'Unknown';tt.textContent=title.length>35?condense(title,32):title;if(title.length>50)tt.style.fontSize='10px';else if(title.length>35)tt.style.fontSize='11px';else tt.style.fontSize='';tg.textContent=`${ABBR[w.g]||'UNK'} — ${w.g==='pobots'?'Pobots':w.g==='prestlers'?'Prestlers':w.g==='cultural'?'Cultural Pics':w.g==='pisc'?'Pisc':'Submissions'}`;setTimeout(()=>c.querySelector('.card-inner').classList.remove('top-transitioning'),80)},350);prog=0;const bar=document.getElementById('cycleBar');if(bar)bar.style.width='0%'}

document.getElementById('thumbImg').addEventListener('load',function(){this.classList.add('loaded');document.getElementById('thumbShimmer').style.display='none'});
document.getElementById('thumbImg').addEventListener('error',function(){this.classList.remove('loaded');document.getElementById('thumbShimmer').style.display='block'});

function startProg(){const bar=document.getElementById('cycleBar');if(!bar)return;prog=0;clearInterval(progInt);const ms=100,total=CFG.cycleSecs*1000;progInt=setInterval(()=>{prog+=ms;bar.style.width=Math.min(100,prog/total*100)+'%'},ms)}

function advance(){if(activeWorks.length<=1)return;curIdx=(curIdx+1)%activeWorks.length;const w=activeWorks[curIdx];updateTop(w);updateBottom(w);startProg()}
function random(){if(activeWorks.length<=1)return;let n;do{n=Math.floor(Math.random()*activeWorks.length)}while(n===curIdx);curIdx=n;const w=activeWorks[curIdx];updateTop(w);updateBottom(w);startProg()}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();advance()}if(e.code==='KeyR')random();if(e.code==='KeyH'){isHidden=!isHidden;const t=document.getElementById('topCard'),b=document.getElementById('bottomCard');if(isHidden){t.classList.add('hidden-manual');b.classList.add('hidden-manual')}else{t.classList.remove('hidden-manual');b.classList.remove('hidden-manual')}}if(e.code==='Digit1'){CFG.showTop=!CFG.showTop;const t=document.getElementById('topCard');if(!CFG.showTop)t.classList.add('hidden-manual');else{t.classList.remove('hidden-manual');if(!isHidden)t.classList.add('visible')}}if(e.code==='Digit2'){CFG.showBottom=!CFG.showBottom;const b=document.getElementById('bottomCard');if(!CFG.showBottom)b.classList.add('hidden-manual');else{b.classList.remove('hidden-manual');if(!isHidden)b.classList.add('visible')}}});

function init(){if(CFG.showGrain)genGrain();document.getElementById('labelText').textContent=CFG.label;if(CFG.sub){const s=document.getElementById('subLabel');s.textContent=CFG.sub;s.style.display='block'}if(activeWorks.length>0){curIdx=0;const w=activeWorks[0];updateTop(w);updateBottom({t:CFG.title||w.t,g:w.g});startProg();cycInt=setInterval(advance,CFG.cycleSecs*1000)}else{updateBottom({t:'No artworks found',g:'pobots'})}}

setTimeout(init,300);

// External API
window.setLabel=t=>{document.getElementById('labelText').textContent=t||'NOW DESIGNING'};
window.setSubLabel=t=>{const e=document.getElementById('subLabel');if(t){e.textContent=t;e.style.display='block'}else e.style.display='none'};
window.setTitle=t=>{CFG.title=t;if(activeWorks.length)updateBottom({...activeWorks[curIdx],t})};
window.advanceArtwork=advance;
window.randomArtwork=random;
</script>
