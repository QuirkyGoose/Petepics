     PEET PICS — 10-MINUTE STREAM STARTING COUNTDOWN
     Self-contained HTML with rotating artwork carousel.

     HOW TO USE IN OBS:
     1. Add a Browser Source
     2. Check "Local file" → point to this HTML file
     3. Width: 1920, Height: 1080

     URL PARAMETERS:
       minutes=NUM       Countdown duration (default: 10)
       label=TEXT         Heading text (default: "STARTING SOON")
       gallery=KEY        Filter: pobots|prestlers|cultural|pisc|submissions|all

       grain=true|false   Film grain effect (default: true)

     KEYBOARD SHORTCUTS:
       Space — Pause/Resume
       R     — Reset countdown

     ═══════════════════════════════════════════════════════════════ -->

<style>

  /* ═══ SCAN LINE ═══ */

  /* ═══ MAIN CONTENT ═══ */

  /* Logo / Title */
  .logo-area{text-align:center;margin-bottom:32px}
  .logo-title{font-family:'Newsreader',serif;font-size:48px;font-weight:600;color:var(--cream);letter-spacing:-.01em;line-height:1.1;text-shadow:0 2px 20px rgba(0,0,0,.5)}
  .logo-subtitle{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--amber);margin-top:8px;opacity:.8}
  .logo-accent{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent);margin:16px auto 0;opacity:.5}

  /* Countdown */
  .countdown-area{text-align:center;margin-bottom:40px}
  .countdown-digits{font-family:'JetBrains Mono',monospace;font-size:140px;font-weight:700;letter-spacing:.05em;color:var(--cream);line-height:1;text-shadow:0 0 60px rgba(212,168,83,.15),0 4px 30px rgba(0,0,0,.5);transition:color .3s,text-shadow .3s;position:relative}
  .countdown-digits .colon{color:var(--amber);opacity:.6;animation:colonPulse 1s step-end infinite}

  .countdown-digits.urgent{color:var(--red);text-shadow:0 0 80px rgba(196,71,58,.3),0 4px 30px rgba(0,0,0,.5)}
  .countdown-digits.urgent .colon{color:var(--red)}
  .countdown-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-top:12px}

  /* Heading label */
  .heading-label{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:10px;justify-content:center}
  .heading-dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px rgba(196,71,58,.5);animation:dotPulse 2s ease-in-out infinite}
  @keyframes dotPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

  /* ═══ ARTWORK CAROUSEL ═══ */
  .carousel-area{width:900px;max-width:90%;margin:0 auto}
  .carousel-track{position:relative;height:200px;overflow:hidden;border-radius:4px;background:rgba(26,24,20,.5);border:1px solid rgba(212,168,83,.08)}
  .carousel-inner{display:flex;height:100%;transition:transform .8s cubic-bezier(.16,1,.3,1);will-change:transform}
  .carousel-slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .carousel-slide img{max-height:180px;max-width:85%;object-fit:contain;opacity:0;transition:opacity .5s ease .2s;filter:drop-shadow(0 4px 20px rgba(0,0,0,.5))}
  .carousel-slide img.loaded{opacity:1}

  /* Carousel slide info */
  .carousel-info{position:absolute;bottom:0;left:0;right:0;padding:8px 16px;background:linear-gradient(transparent,rgba(12,10,9,.9));display:flex;justify-content:space-between;align-items:flex-end}
  .carousel-info .slide-title{font-family:'Newsreader',serif;font-size:13px;font-weight:500;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;opacity:.8}

  /* Carousel navigation dots */

  .carousel-dot{width:24px;height:3px;border-radius:2px;background:rgba(212,168,83,.2);cursor:pointer;transition:all .3s}
  .carousel-dot.active{background:var(--amber);width:40px;box-shadow:0 0 8px rgba(212,168,83,.3)}

  /* Progress bar at bottom of carousel */
  .carousel-progress{height:2px;background:rgba(0,0,0,.3);border-radius:0 0 4px 4px;overflow:hidden;margin-top:-2px;position:relative;z-index:1}
  .carousel-progress-fill{height:100%;background:var(--amber);width:0%;opacity:.5;transition:width .1s linear}

  /* ═══ BOTTOM INFO BAR ═══ */
  .info-bar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(12,10,9,.8))}
  .info-bar-left{display:flex;align-items:center;gap:12px}
  .info-bar-right{display:flex;align-items:center;gap:16px}
  .info-tag{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:3px 8px;border:1px solid rgba(212,168,83,.12);border-radius:2px}

  /* ═══ PAUSE OVERLAY ═══ */
  .pause-overlay{position:fixed;inset:0;z-index:50;background:rgba(12,10,9,.7);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
  .pause-overlay.visible{opacity:1;pointer-events:auto}
  .pause-text{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);text-shadow:0 0 30px rgba(212,168,83,.3)}

  .finished .countdown-digits{color:var(--amber);text-shadow:0 0 100px rgba(212,168,83,.4),0 4px 30px rgba(0,0,0,.5);animation:finishedPulse 1.5s ease-in-out infinite}

  .gallery-pobots{--accent:#d4a853}
  .gallery-prestlers{--accent:#a0522d}
  .gallery-cultural{--accent:#b5707e}
  .gallery-pisc{--accent:#6b7c5e}
  .gallery-submissions{--accent:#6b7c5e}
</style>

const BG_COUNT = Math.min(8, activeWorks.length);
const bgWorks = activeWorks.slice(0, BG_COUNT);

let paused = false;
let totalSeconds = CFG.minutes * 60;
let remainingSeconds = totalSeconds;
let countdownInterval = null;
let carouselIdx = 0;
let carouselInterval = null;
let carouselProg = 0;
let carouselProgInterval = null;
let bgIdx = 0;
let bgInterval = null;
let finished = false;

// ── Grain ──
function genGrain(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');if(!x)return;const d=x.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=v;d.data[i+1]=v;d.data[i+2]=v;d.data[i+3]=12}x.putImageData(d,0,0);const g=document.createElement('div');g.className='grain-overlay';g.style.backgroundImage=`url(${c.toDataURL('image/png')})`;document.body.appendChild(g)}

// ── Text condensing ──
function condense(t,m){if(!t||t.length<=m)return t;let s=t.slice(0,m-1);const l=s.lastIndexOf(' ');if(l>m*.5)s=s.slice(0,l);return s+'...'}

// ── Update countdown display ──
function updateDisplay(){
  const min = Math.floor(remainingSeconds/60);
  const sec = remainingSeconds%60;
  document.getElementById('cdMin').textContent = String(min).padStart(2,'0');
  document.getElementById('cdSec').textContent = String(sec).padStart(2,'0');

  const cd = document.getElementById('countdown');
  if(remainingSeconds <= 30 && remainingSeconds > 0){
    cd.classList.add('urgent');
  } else {
    cd.classList.remove('urgent');
  }

  if(remainingSeconds <= 0 && !finished){
    finished = true;
    document.getElementById('mainContent').classList.add('finished');
    document.getElementById('headingText').textContent = 'WE\'RE LIVE';
    cd.classList.remove('urgent');
    // Stop carousel auto-cycle but keep showing
    clearInterval(carouselInterval);
    clearInterval(carouselProgInterval);
  }
}

// ── Countdown tick ──
function tick(){
  if(paused || finished) return;
  remainingSeconds--;
  if(remainingSeconds < 0) remainingSeconds = 0;
  updateDisplay();
}

// ── Build carousel ──
function buildCarousel(){
  const inner = document.getElementById('carouselInner');
  const dots = document.getElementById('carouselDots');
  inner.innerHTML = '';
  dots.innerHTML = '';

  carouselWorks.forEach((w, i) => {
    // Slide
    const slide = document.createElement('div');
    slide.className = 'carousel-slide';
    const img = document.createElement('img');
    img.src = w.u;
    img.alt = w.t;
    img.loading = 'lazy';
    img.onload = function(){ this.classList.add('loaded'); };
    slide.appendChild(img);
    inner.appendChild(slide);

    // Dot
    const dot = document.createElement('div');
    dot.className = 'carousel-dot' + (i===0?' active':'');
    dot.onclick = () => goToSlide(i);
    dots.appendChild(dot);
  });

  // Set gallery count
  document.getElementById('galleryCount').textContent = `${activeWorks.length} WORKS`;

  // Show first slide info
  updateSlideInfo(0);
}

function updateSlideInfo(idx){
  const w = carouselWorks[idx];
  if(!w) return;
  document.getElementById('slideTitle').textContent = condense(w.t, 50);
  document.getElementById('slideGallery').textContent = `${ABBR[w.g]||'UNK'} — ${GNAME[w.g]||w.g}`;
}

function goToSlide(idx){
  carouselIdx = idx;
  const inner = document.getElementById('carouselInner');
  inner.style.transform = `translateX(-${idx * 100}%)`;

  // Update dots
  document.querySelectorAll('.carousel-dot').forEach((d,i) => {
    d.classList.toggle('active', i===idx);
  });

  updateSlideInfo(idx);
  carouselProg = 0;
  const bar = document.getElementById('carouselProgress');
  if(bar) bar.style.width = '0%';
}

function advanceCarousel(){
  carouselIdx = (carouselIdx + 1) % carouselWorks.length;
  goToSlide(carouselIdx);
}

function startCarouselProgress(){
  carouselProg = 0;
  clearInterval(carouselProgInterval);
  const tick = 100;
  const total = CFG.speed * 1000;
  carouselProgInterval = setInterval(() => {
    if(paused) return;
    carouselProg += tick;
    const bar = document.getElementById('carouselProgress');
    if(bar) bar.style.width = Math.min(100, carouselProg/total*100) + '%';
  }, tick);
}

// ── Background artwork rotation ──
function buildBackground(){
  const container = document.getElementById('bgArtwork');
  bgWorks.forEach((w,i) => {
    const img = document.createElement('img');
    img.src = w.u;
    img.alt = '';
    img.loading = 'lazy';
    if(i===0) img.classList.add('active');
    container.appendChild(img);
  });
}

function rotateBackground(){
  const imgs = document.querySelectorAll('#bgArtwork img');
  if(imgs.length <= 1) return;
  imgs[bgIdx].classList.remove('active');
  bgIdx = (bgIdx + 1) % imgs.length;
  imgs[bgIdx].classList.add('active');
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if(e.code === 'Space'){
    e.preventDefault();
    paused = !paused;
    document.getElementById('pauseOverlay').classList.toggle('visible', paused);
  }
  if(e.code === 'KeyR'){
    remainingSeconds = totalSeconds;
    finished = false;
    paused = false;
    document.getElementById('mainContent').classList.remove('finished');
    document.getElementById('headingText').textContent = CFG.label;
    document.getElementById('pauseOverlay').classList.remove('visible');
    updateDisplay();
  }
  if(e.code === 'KeyH'){
    const content = document.getElementById('mainContent');
    content.style.opacity = content.style.opacity === '0' ? '1' : '0';
  }
});

// ── Init ──
function init(){
  if(CFG.showGrain) genGrain();
  document.getElementById('headingText').textContent = CFG.label;
  updateDisplay();
  buildCarousel();
  buildBackground();

  // Start countdown
  countdownInterval = setInterval(tick, 1000);

  // Start carousel
  carouselInterval = setInterval(() => {
    if(!paused && !finished) advanceCarousel();
  }, CFG.speed * 1000);
  startCarouselProgress();

  // Start bg rotation
  bgInterval = setInterval(() => {
    if(!paused) rotateBackground();
  }, 15000);
}

setTimeout(init, 300);
</script>
</body>
</html>
